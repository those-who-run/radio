name: CI

# Three jobs are required by name on `main` once scripts/repos.json in
# those-who-run/.github lists the third: `test`, the repository's own checks,
# `checks / checks`, the language-neutral checks every repository runs, from
# checks.yml in those-who-run/.github, and `python / check`, the Python checks, from
# python.yml there. Renaming any leaves `main` waiting for a check that never
# reports.
#
# merge_group runs them again on what a merge queue would land, the PR merged onto
# `main` and the PRs ahead of it; a queue whose required checks never report there
# never merges.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]

# Nothing by default; each job asks for what it uses.
permissions: {}

# A new push to a PR cancels its superseded run; runs on main and in the merge
# queue always finish (a queue run has a ref of its own, and the queue would read a
# cancelled run as a failure).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions and the reusable workflow are pinned by commit SHA (the tag in the
# comment); Renovate bumps them (renovate.json).
jobs:
  # The repository's own checks, the same `make test` a laptop runs: the Markdown
  # links, the guard copy against .github's agent/ at the commit pinned for checks.yml
  # below, and the tests.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.15"
      - name: make test
        run: make test

  # The commit hooks on every file, gitleaks over the PR's commits, the PR title and
  # dependency review. No `if:` or `needs:`, so the required check always reports.
  # The guard copy check reads this pin, so bump the copies in .claude/ with it.
  checks:
    permissions:
      contents: read
    uses: those-who-run/.github/.github/workflows/checks.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15

  # uv.lock up to date, the install from it, ruff format and check, mypy, and the
  # tests with no skips and the coverage floor, as `make python` runs them. The
  # floor is the Makefile's COVERAGE_FLOOR and pyproject.toml's fail_under too
  # (tests/test_python_floor.py keeps the three equal).
  python:
    permissions:
      contents: read
    uses: those-who-run/.github/.github/workflows/python.yml@a575c2f0b39782e142fb7d4ac17082e05b407a2f # v0.2.15
    with:
      coverage-floor: 90
