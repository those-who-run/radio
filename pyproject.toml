[project]
name = "radio"
# release-please moves the version once radio releases.
version = "0.0.0"
description = "The voice engineer of Those Who Run v2: callouts from NATS spoken in Discord"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.14"
dependencies = [
  # Discord voice, as v1 (paddock#58): its voice extra brings PyNaCl and davey (the
  # voice encryption Discord requires); the image adds libopus and ffmpeg.
  "discord-py[voice]==2.7.1",
  "nats-py==2.16.0", # the NATS client (paddock#55: the stable one, asyncio)
  "piper-tts==1.8.0", # the voice, as v1 (paddock#57); onnxruntime under it holds radio on 3.14
  "pyyaml==6.0.3", # the voice: settings file, v1's rules file format (paddock#57)
  # The callout and its CloudEvents headers, from contracts' release tag (paddock#265).
  "twr-contracts @ git+https://github.com/those-who-run/contracts@v0.2.3#subdirectory=gen/python",
]

[project.scripts]
radio = "radio.__main__:main"

# The tools `make check` and CI's `python / check` run (those-who-run/.github's
# python.yml), at the versions uv.lock pins.
[dependency-groups]
dev = [
  "coverage>=7.17",
  "mypy>=2.4",
  "pytest>=9.2",
  "pytest-asyncio>=1.4",
  "ruff>=0.17",
  "types-protobuf>=6.32",
  "types-pyyaml>=6.0.12",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13"
# discord.py 2.7.1 caps PyNaCl below 1.6, and 1.5.0 bundles a libsodium with
# GHSA-mrfv-m5wm-5w6w (fixed in 1.6.2). discord.py's master allows 1.6.x
# ("Bump PyNaCl version to allow 1.6.x version installs"); drop this once a
# release does.
override-dependencies = ["pynacl==1.6.2"]

[tool.ruff]
line-length = 100
target-version = "py314"
# The package and its tests. The scripts in scripts/ and the unittest tests beside
# them in tests/ are copies from paddock and .github, kept as they are there;
# scripts/v1_phrases.py imports v1, which radio does not install.
include = ["src/**/*.py", "tests/unit/**/*.py", "tests/voice/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
files = ["src", "tests/unit", "tests/voice"]
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# An expected failure that passes fails the run; a skip fails it in `make check`.
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src/radio"]
branch = true

[tool.coverage.report]
# The floor `make check` enforces, and the coverage-floor ci.yml passes to
# python.yml. Raise it as coverage climbs; never lower it.
fail_under = 90
show_missing = true
skip_covered = true
